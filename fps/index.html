<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>NERD OF DUTY — A Fintech NerdCon Game</title>
    <!-- Inline data-URI favicon: Void Black square, Loot Gold ledger book with a
         dark spine. Self-contained so it never 404s. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%23050505'/%3E%3Crect%20x='4'%20y='3'%20width='8'%20height='10'%20rx='1'%20fill='%23FFD700'/%3E%3Crect%20x='7.3'%20y='3'%20width='1.4'%20height='10'%20fill='%23050505'/%3E%3C/svg%3E"
    />
    <!-- Arcade Terminal type system: JetBrains Mono carries the HUD, Press Start 2P
         is reserved for the title wordmark + INSERT COIN moments (see NERDCON_CONTRACT). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; }
      body {
        font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
        -webkit-font-smoothing: antialiased;
      }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }

      /* ================================================================ boot
         PRE-ENGINE LOADING SCREEN.

         This markup is parsed and painted before /src/main.js has even been
         fetched, so the ~2.9 s engine.init() long task no longer happens behind
         a black screen. The inline script at the bottom of <body> owns this DOM
         until main.js subscribes to `boot:progress` and drives it.

         Palette is the Arcade Terminal contract, exact hexes: Void Black
         #050505 field, Panel Dark #0D0D0D bar track, Loot Gold #FFD700 fill,
         Cyan Pulse #00E5FF phase caption. Nothing here is loaded from the
         network except the two webfonts, which degrade through the mono stack.
      */
      #boot {
        position: fixed; inset: 0; z-index: 9000;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 90% 60% at 50% 22%, rgba(53, 104, 255, 0.13), transparent 62%),
          radial-gradient(ellipse 80% 70% at 50% 106%, rgba(255, 45, 120, 0.1), transparent 64%),
          #050505;
        color: #f0f0f0; text-transform: uppercase;
        opacity: 1; transition: opacity 0.42s ease-out;
        will-change: opacity;
      }
      /* CRT scanlines — same cabinet substrate as the attract screen. */
      #boot::before {
        content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.45;
        background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.22) 3px);
        background-size: 100% 3px; mix-blend-mode: multiply;
      }
      #boot::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        box-shadow: inset 0 0 260px 44px rgba(0, 0, 0, 0.72);
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      .boot-inner {
        position: relative; z-index: 1;
        width: min(720px, 88vw);
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .boot-mode {
        font-size: 10px; letter-spacing: 0.5em; padding-left: 0.5em; color: #00e5ff;
        text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
      }
      /* The one Press Start 2P element on this screen (contract: max 2). */
      .boot-title {
        font-family: "Press Start 2P", "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(20px, 3.4vw, 40px); line-height: 1.1; letter-spacing: 0.02em;
        margin: 22px 0 16px;
        text-shadow: 3px 3px 0 #ff2d78, -2px -1px 0 #00e5ff, 0 0 32px rgba(53, 104, 255, 0.5);
      }
      .boot-sub {
        font-size: 11px; letter-spacing: 0.42em; padding-left: 0.42em;
        color: rgba(240, 240, 240, 0.6);
      }
      .boot-bar {
        position: relative; width: 100%; height: 8px; margin: 46px 0 0;
        background: #0d0d0d;
        box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.3), 0 0 22px rgba(0, 229, 255, 0.06);
        overflow: hidden;
      }
      .boot-bar > i {
        display: block; height: 100%; width: 100%;
        transform: scaleX(0); transform-origin: left center;
        background: linear-gradient(90deg, #b38f00 0%, #ffd700 78%, #fff3a8 100%);
        box-shadow: 0 0 14px rgba(255, 215, 0, 0.45);
        will-change: transform;
      }
      .boot-row {
        display: flex; justify-content: space-between; align-items: baseline;
        width: 100%; margin-top: 12px;
        font-size: 11px; letter-spacing: 0.24em;
      }
      #boot-phase { color: #00e5ff; }
      #boot-pct { color: rgba(240, 240, 240, 0.6); font-variant-numeric: tabular-nums; }
      .boot-tip {
        margin-top: 56px; min-height: 1.4em;
        font-size: 11px; letter-spacing: 0.2em; color: #888888;
        transition: opacity 0.3s linear;
      }
      .boot-foot {
        margin-top: 22px; font-size: 9.5px; letter-spacing: 0.34em;
        color: rgba(240, 240, 240, 0.24);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>

    <div id="boot">
      <div class="boot-inner">
        <div class="boot-mode">HOLD THE LEDGER</div>
        <div class="boot-title">NERD OF DUTY</div>
        <div class="boot-sub">A FINTECH NERDCON GAME</div>
        <div class="boot-bar"><i id="boot-fill"></i></div>
        <div class="boot-row">
          <span id="boot-phase">OPENING THE BOOKS</span>
          <span id="boot-pct">0%</span>
        </div>
        <div class="boot-tip" id="boot-tip">T+2 IS NOT A FEATURE.</div>
        <div class="boot-foot">NOV 19–20 · SAN DIEGO · FINTECHNERDCON.COM</div>
      </div>
    </div>

    <script>
      /**
       * Loading-screen driver. Deliberately a classic (non-module) inline
       * script: it runs during parse, before the deferred module graph is even
       * fetched, so the bar exists and the tips rotate while the engine module
       * is still evaluating. `main.js` takes over by calling window.__BOOT__.set
       * from every `boot:progress` event; nothing else here talks to the engine.
       *
       * No RNG anywhere — the tip order is a fixed rotation, so a capture is
       * reproducible and two players see the same first line.
       */
      (function () {
        var root = document.getElementById('boot');
        var fill = document.getElementById('boot-fill');
        var phase = document.getElementById('boot-phase');
        var pctEl = document.getElementById('boot-pct');
        var tipEl = document.getElementById('boot-tip');

        /* Dry, fintech-literate, all caps. Rotated in this exact order. */
        var TIPS = [
          'T+2 IS NOT A FEATURE.',
          'THE LEDGER DOES NOT RECONCILE ITSELF.',
          'REAL-TIME MEANS TUESDAY, IN PRACTICE.',
          'COBOL DOES NOT NEGOTIATE.',
          'A CHARGEBACK IS A REFUND WITH LAWYERS.',
          'THE FAX IS STILL IN THE PAYMENT FLOW.',
          'COMPLIANCE IS A CONTACT SPORT.',
          'EVERY OUTAGE IS A BATCH JOB SOMEBODY LOVED.',
        ];

        var capture = false;
        try {
          capture = /(^|[?&])capture=1(&|$)/.test(location.search);
        } catch (e) {
          /* no location (never in a browser, but keep the driver total) */
        }

        // Capture harness: the screenshot must frame the game, never a loading
        // overlay, and the deterministic frame budget must not pay for a fade.
        // Gone before the first byte of engine work.
        if (capture) {
          root.style.display = 'none';
          window.__BOOT__ = { set: function () {}, done: function () {}, fail: function () {} };
          return;
        }

        var shown = 0;
        var tipTimer = setInterval(function () {
          shown = (shown + 1) % TIPS.length;
          tipEl.style.opacity = '0';
          setTimeout(function () {
            tipEl.textContent = TIPS[shown];
            tipEl.style.opacity = '1';
          }, 300);
        }, 2500);

        var last = 0;
        var lastPhase = '';
        var finished = false;

        function stop() {
          if (tipTimer) clearInterval(tipTimer);
          tipTimer = null;
        }

        window.__BOOT__ = {
          /** @param {number} pct 0..1, monotonic. @param {string} [detail] caption */
          set: function (pct, detail) {
            if (finished) return;
            var p = pct > 1 ? 1 : pct < 0 ? 0 : pct;
            if (p > last) {
              last = p;
              fill.style.transform = 'scaleX(' + p.toFixed(4) + ')';
              pctEl.textContent = Math.round(p * 100) + '%';
            }
            if (detail && detail !== lastPhase) {
              lastPhase = detail;
              phase.textContent = detail;
            }
          },
          /** Boot finished: land on 100%, fade out, drop the node. */
          done: function () {
            if (finished) return;
            finished = true;
            stop();
            fill.style.transform = 'scaleX(1)';
            pctEl.textContent = '100%';
            phase.textContent = 'CLEARED FOR DEPLOY';
            root.classList.add('gone');
            setTimeout(function () {
              if (root.parentNode) root.parentNode.removeChild(root);
            }, 500);
          },
          /** Boot threw: get out of the way so the error is legible. */
          fail: function () {
            finished = true;
            stop();
            root.style.display = 'none';
          },
        };
      })();
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
